<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Room Booking</title>

<style>
body { font-family: Arial; max-width: 900px; margin: auto; }
h1 { text-align:center; }
form { background:#f2f2f2; padding:20px; border-radius:10px; }
input, select, button { padding:8px; margin:5px; }
.roomSection { margin-top:30px; padding:15px; border:1px solid #ddd; border-radius:10px; }
.booking { padding:5px; background:#e8f4ff; margin:5px 0; border-radius:5px; }
</style>
</head>

<body>

<h1>Room Booking System</h1>

<form id="bookingForm">
<input required placeholder="First name" id="firstname">
<input required placeholder="Last name" id="lastname">

<select id="room">
  <option>Room 1</option>
  <option>Room 2</option>
  <option>Room 3</option>
</select>

<input type="date" id="date" required>

<select id="time"></select>

<select id="duration">
  <option value="30">30 mins</option>
  <option value="60">60 mins</option>
  <option value="90">90 mins</option>
</select>

<button type="submit">Book Room</button>
</form>

<h2>Current Bookings</h2>
<div id="bookings"></div>

<script>
const API = "https://sheetdb.io/api/v1/9uo8rb9rrusr9";

// create time dropdown 07:00 → 22:00 every 30 mins
const timeSelect = document.getElementById("time");
for (let h = 7; h < 22; h++) {
  ["00","30"].forEach(m => {
    let t = String(h).padStart(2,'0') + ":" + m;
    timeSelect.innerHTML += `<option>${t}</option>`;
  });
}

// convert to Date object
function makeDate(date, time){
  return new Date(date + "T" + time);
}

// delete past bookings automatically
async function deletePastBookings(bookings){
  const now = new Date();
  for (let b of bookings){
    if(new Date(b.end) < now){
      await fetch(API + `/end/${b.end}`, { method:"DELETE" });
    }
  }
}

// check overlap
function overlaps(start,end,existing){
  for (let b of existing){
    let s = new Date(b.start);
    let e = new Date(b.end);
    if(start < e && end > s) return true;
  }
  return false;
}

// load bookings
async function loadBookings(){
  const res = await fetch(API);
  let data = await res.json();

  await deletePastBookings(data);

  const div = document.getElementById("bookings");
  div.innerHTML = "";

  ["Room 1","Room 2","Room 3"].forEach(room=>{
    let roomDiv = document.createElement("div");
    roomDiv.className="roomSection";
    roomDiv.innerHTML = `<h3>${room}</h3>`;

    data.filter(b=>b.room===room).forEach(b=>{
      roomDiv.innerHTML += `<div class="booking">
        ${b.firstname} ${b.lastname}<br>
        ${new Date(b.start).toLocaleString()} → ${new Date(b.end).toLocaleTimeString()}
      </div>`;
    });

    div.appendChild(roomDiv);
  });

  return data;
}

// submit booking
document.getElementById("bookingForm").onsubmit = async e=>{
  e.preventDefault();

  const firstname = firstname.value.trim();
  const lastname = lastname.value.trim();
  const room = room.value;
  const date = date.value;
  const time = time.value;
  const duration = parseInt(duration.value);

  const start = makeDate(date,time);
  const end = new Date(start.getTime() + duration*60000);

  if(end.getHours() > 22){
    alert("Booking must finish before 22:00");
    return;
  }

  const bookings = await loadBookings();
  const sameRoom = bookings.filter(b=>b.room===room);

  if(overlaps(start,end,sameRoom)){
    alert("This room is already booked in that time slot");
    return;
  }

  // save to Google Sheet via SheetDB
  await fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      data:[{
        firstname, lastname, room,
        start: start.toISOString(),
        end: end.toISOString()
      }]
    })
  });

  alert("Booking successful!");
  loadBookings();
};

loadBookings();
</script>

</body>
</html>
