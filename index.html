<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Rooms Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-4xl mx-auto p-4">

    <!-- Booking Form -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Woolwich Practice Space Booking System</h1>
        <p class="text-center text-gray-500 mb-3">Available times: 07:00 - 22:00 | Minimum booking: 30 mins</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="border rounded-lg p-4 bg-blue-50">
                <h2 class="font-bold text-lg text-blue-700 mb-2">Practice Bunk 1</h2>
                <select id="roomBunk1" class="w-full p-2 border rounded bg-white"></select>
            </div>
            <div class="border rounded-lg p-4 bg-green-50">
                <h2 class="font-bold text-lg text-green-700 mb-2">Practice Bunk 2</h2>
                <select id="roomBunk2" class="w-full p-2 border rounded bg-white"></select>
            </div>
            <div class="border rounded-lg p-4 bg-purple-50">
                <h2 class="font-bold text-lg text-purple-700 mb-2">Piano Only</h2>
                <select id="roomPiano" class="w-full p-2 border rounded bg-white"></select>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" id="date" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Start Time</label>
                <select id="startTime" class="w-full p-2 border rounded"></select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
                <select id="endTime" class="w-full p-2 border rounded"></select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                <input type="text" id="fname" placeholder="Enter first name" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                <input type="text" id="lname" placeholder="Enter last name" class="w-full p-2 border rounded">
            </div>
        </div>

        <button onclick="bookRoom()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition mb-2">BOOK NOW</button>
    </div>

    <!-- Current Bookings -->
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-xl font-bold mb-4">Current Bookings</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="border border-blue-200 rounded-lg p-3 bg-blue-50">
                <h4 class="font-bold text-blue-700 mb-2">Practice Bunk 1</h4>
                <div id="listBunk1" class="space-y-2 text-sm"><p class="text-gray-500 italic">No bookings</p></div>
            </div>
            <div class="border border-green-200 rounded-lg p-3 bg-green-50">
                <h4 class="font-bold text-green-700 mb-2">Practice Bunk 2</h4>
                <div id="listBunk2" class="space-y-2 text-sm"><p class="text-gray-500 italic">No bookings</p></div>
            </div>
            <div class="border border-purple-200 rounded-lg p-3 bg-purple-50">
                <h4 class="font-bold text-purple-700 mb-2">Piano Only</h4>
                <div id="listPiano" class="space-y-2 text-sm"><p class="text-gray-500 italic">No bookings</p></div>
            </div>
        </div>
    </div>

</div>

<script>
// --- SETTINGS ---
const SHEET_API = "https://sheetdb.io/api/v1/YOUR_API_KEY"; // Replace with your SheetDB API key
const DELETE_PASSWORD = "Woolwich2023";

// --- TIME SLOTS (30 MIN INTERVALS 07:00 - 22:00)
const allTimes = [];
for(let h = 7; h <= 22; h++){
    for(let m = 0; m < 60; m += 30){
        const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        allTimes.push(timeStr);
    }
}

// --- GLOBAL BOOKINGS ---
let bookings = [];

// --- UTILITY FUNCTIONS ---
function singleSelect(selectedId){
    ['Bunk1','Bunk2','Piano'].forEach(id => {
        if(id !== selectedId) {
            document.getElementById('room' + id).value = 'available';
        }
    });
}

function timeToMinutes(timeStr){
    if (typeof timeStr !== 'string' || !timeStr.includes(':')) return 0;
    const [h, m] = timeStr.split(':').map(Number);
    if(isNaN(h) || isNaN(m)) return 0;
    return h * 60 + m;
}

function formatDateDisplay(dateStr){
    if (typeof dateStr !== 'string' || dateStr.trim() === '') return 'N/A';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    const [y, m, d] = parts;
    return `${d}-${m}-${y}`;
}

// --- RENDER BOOKINGS — NOW DISPLAYS TIMES CORRECTLY
function renderSection(roomName, elementId){
    const listEl = document.getElementById(elementId);
    const roomBookings = bookings.filter(b => b.room === roomName);
    
    if(roomBookings.length === 0){
        listEl.innerHTML = '<p class="text-gray-500 italic">No bookings</p>';
        return;
    }
    
    listEl.innerHTML = '';
    roomBookings.forEach((b, index) => {
        const date = formatDateDisplay(b.date || '');
        const startTime = b.startTime || 'N/A';
        const endTime = b.endTime || 'N/A';
        const firstName = b.firstName || 'Unknown';
        const lastName = b.lastName || 'User';
        const fullName = `${firstName} ${lastName}`.trim();
        
        const el = document.createElement('div');
        el.className = 'bg-white p-2 rounded border';
        el.innerHTML = `
            <div class="font-semibold">${date}</div>
            <div><strong>${startTime}</strong> → <strong>${endTime}</strong></div>
            <div class="text-gray-600 text-xs">${fullName}</div>
            <button onclick="requestDelete(${index})" class="text-red-500 hover:text-red-700 text-xs mt-1">✕ Delete</button>
        `;
        listEl.appendChild(el);
    });
}

function updateList(){
    renderSection("Practice Bunk 1","listBunk1");
    renderSection("Practice Bunk 2","listBunk2");
    renderSection("Piano Only","listPiano");
}

// --- FETCH BOOKINGS FROM SHEETDB — NOW READS FIELDS CORRECTLY
async function fetchBookings(){
    try {
        const res = await fetch(SHEET_API);
        if (!res.ok) throw new Error('Network response was not ok');
        
        const data = await res.json();
        bookings = data.map(b => ({
            id: b._id || b.id || '',
            room: b.Room || '',
            date: b.Date || '',
            startTime: b.StartTime || '',
            endTime: b.EndTime || '',
            firstName: b.FirstName || '',
            lastName: b.LastName || ''
        }));
        
        updateList();
    } catch (error) {
        console.error('Error fetching bookings:', error);
        alert('❌ Failed to load bookings. Please refresh the page.');
    }
}

// --- DELETE BOOKING
async function requestDelete(index){
    const password = prompt("Enter password to delete this booking:");
    if(password !== DELETE_PASSWORD){
        alert("❌ Incorrect password");
        return;
    }
    
    const booking = bookings[index];
    const rowId = booking.id;
    
    if(!rowId){
        alert("❌ Cannot delete: Booking ID missing");
        return;
    }

    try {
        const res = await fetch(`${SHEET_API}/${rowId}`, {method:'DELETE'});
        if(res.ok){ 
            alert("✅ Booking deleted"); 
            await fetchBookings(); 
        } else {
            throw new Error('Delete failed');
        }
    } catch (error) {
        console.error('Error deleting booking:', error);
        alert("❌ Error deleting booking");
    }
}

// --- CONFLICT CHECK — STRICT OVERLAP PREVENTION
function hasTimeConflict(newBooking, existingBookings) {
    const newStartMins = timeToMinutes(newBooking.startTime);
    const newEndMins = timeToMinutes(newBooking.endTime);

    if(newStartMins === 0 || newEndMins === 0 || newEndMins <= newStartMins) return false;

    return existingBookings.some(booking => {
        if (booking.room !== newBooking.room || booking.date !== newBooking.date) return false;

        const existingStartMins = timeToMinutes(booking.startTime);
        const existingEndMins = timeToMinutes(booking.endTime);

        if(existingStartMins === 0 || existingEndMins === 0) return false;

        return newStartMins < existingEndMins && newEndMins > existingStartMins;
    });
}

// --- BOOK ROOM — NOW SAVES FIELDS CORRECTLY TO SHEET
async function bookRoom(){
    // Room selection
    const sel1 = document.getElementById('roomBunk1').value;
    const sel2 = document.getElementById('roomBunk2').value;
    const selP = document.getElementById('roomPiano').value;
    let room = null;

    if(sel1 !== 'available') room = 'Practice Bunk 1';
    else if(sel2 !== 'available') room = 'Practice Bunk 2';
    else if(selP !== 'available') room = 'Piano Only';

    const date = document.getElementById('date').value;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const fname = document.getElementById('fname').value.trim();
    const lname = document.getElementById('lname').value.trim();

    // --- VALIDATION
    if(!room || !date || !fname || !lname){
        alert('⚠️ Please fill in ALL fields!');
        return;
    }
    if(!startTime || !endTime){
        alert('⚠️ Please select both a start and end time!');
        return;
    }
    if(timeToMinutes(endTime) - timeToMinutes(startTime) < 30){
        alert('⚠️ Minimum booking length is 30 minutes!');
        return;
    }
    if(timeToMinutes(endTime) > timeToMinutes("22:00")){
        alert('⚠️ Room closes at 22:00 — please choose an earlier end time!');
        return;
    }

    const newBooking = { room, date, startTime, endTime };
    const conflict = hasTimeConflict(newBooking, bookings);

    if(conflict){
        alert('❌ This time overlaps with an existing booking in this room! Please choose different times or room.'); 
        return;
    }

    // THIS IS EXACTLY WHAT GETS WRITTEN TO GOOGLE SHEETS — MATCH HEADERS EXACTLY
    const sheetData = {
        Room: room,
        Date: date,
        StartTime: startTime,
        EndTime: endTime,
        FirstName: fname,
        LastName: lname
    };

    try {
        const res = await fetch(SHEET_API, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({data: sheetData})
        });

        if(res.ok){
            alert('✅ Booking added successfully!');
            await fetchBookings();
            
            // Reset form
            document.getElementById('roomBunk1').value = 'available';
            document.getElementById('roomBunk2').value = 'available';
            document.getElementById("roomPiano").value = 'available';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            document.getElementById('fname').value = '';
            document.getElementById('lname').value = '';
        } else {
            throw new Error('Save failed');
        }
    } catch (error) {
        console.error('Error saving booking:', error);
        alert('❌ Error saving booking! Please try again.');
    }
}

// --- INITIALISE FORM
document.addEventListener('DOMContentLoaded', () => {
    // Room dropdowns
    ['Bunk1','Bunk2','Piano'].forEach(id => {
        const sel = document.getElementById('room' + id);
        sel.innerHTML = '<option value="available">-- Select this room --</option>';
        allTimes.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t;
            sel.appendChild(opt);
        });
        sel.addEventListener('change', () => singleSelect(id));
    });

    // Start & End time dropdowns
    const startSel = document.getElementById('startTime');
    const endSel = document.getElementById('endTime');
    startSel.innerHTML = '<option value="">-- Select start time --</option>';
    endSel.innerHTML = '<option value="">-- Select end time --</option>';
    allTimes.forEach(t => {
        const opt1 = document.createElement('option');
        opt1.value = t;
        opt1.textContent = t;
        startSel.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = t;
        opt2.textContent = t;
        endSel.appendChild(opt2);
    });
    
    // Set default date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;
    
    fetchBookings();
});
</script>
</body>
</html>
