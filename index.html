<!DOCTYPE html>
<html>
<head>
<title>Practice Room Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold mb-4">Book a Practice Room</h1>

<label>Room</label>
<select id="room" class="w-full p-2 border mb-3">
  <option value="">Select room</option>
  <option>Practice Bunk 1</option>
  <option>Practice Bunk 2</option>
  <option>Piano Only</option>
</select>

<label>Date</label>
<input type="date" id="date" class="w-full p-2 border mb-3">

<div class="grid grid-cols-2 gap-4">
  <div>
    <label>Start Time</label>
    <input type="time" id="start" class="w-full p-2 border">
  </div>
  <div>
    <label>End Time</label>
    <input type="time" id="end" class="w-full p-2 border">
  </div>
</div>

<div class="grid grid-cols-2 gap-4 mt-4">
  <input type="text" id="fname" placeholder="First name" class="p-2 border">
  <input type="text" id="lname" placeholder="Last name" class="p-2 border">
</div>

<button onclick="book()" class="w-full bg-blue-600 text-white p-3 mt-4 rounded">
Save Booking
</button>
</div>

<!-- BOOKINGS LIST -->
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow mt-6">
<h2 class="text-xl font-bold mb-4">Current Bookings</h2>
<div id="list"></div>
</div>

<script>

// 🔴 PASTE YOUR SHEETDB URL HERE
const API = "PASTE_YOUR_SHEETDB_URL_HERE";

let bookings = [];

// Convert time to minutes
function toMinutes(time){
  const [h,m] = time.split(":");
  return (+h*60)+(+m);
}

// Check overlapping bookings
function isOverlapping(newBooking){
  return bookings.some(b => {
    if(b.Room !== newBooking.Room) return false;
    if(b.Date !== newBooking.Date) return false;

    const newStart = toMinutes(newBooking.StartTime);
    const newEnd   = toMinutes(newBooking.EndTime);
    const oldStart = toMinutes(b.StartTime);
    const oldEnd   = toMinutes(b.EndTime);

    return newStart < oldEnd && newEnd > oldStart;
  });
}

// SAVE BOOKING
async function book(){

const data = {
  Room: room.value,
  Date: date.value,
  StartTime: start.value,
  EndTime: end.value,
  FirstName: fname.value,
  LastName: lname.value
};

// Check empty fields
if(Object.values(data).includes("")){
  alert("Please fill in all fields");
  return;
}

// Prevent overlapping bookings
if(isOverlapping(data)){
  alert("This room is already booked during that time.");
  return;
}

// Save to Google Sheet
await fetch(API,{
  method:"POST",
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({data:data})
});

// Add locally so it shows instantly
bookings.push(data);
render();

alert("Booking saved!");
}

// LOAD BOOKINGS FROM GOOGLE SHEET
async function load(){
const res = await fetch(API);
bookings = await res.json();

// Sort by date + time
bookings.sort((a,b)=>{
  if(a.Date === b.Date){
    return toMinutes(a.StartTime) - toMinutes(b.StartTime);
  }
  return new Date(a.Date) - new Date(b.Date);
});

render();
}

// DISPLAY BOOKINGS
function render(){
const list = document.getElementById("list");
list.innerHTML="";

bookings.forEach(b=>{
list.innerHTML += `
<div class="border p-3 mb-2 rounded">
<strong>${b.Room}</strong><br>
${b.Date} ${b.StartTime} → ${b.EndTime}<br>
${b.FirstName} ${b.LastName}
</div>`;
});
}

// Set today's date
date.value = new Date().toISOString().split("T")[0];

// Load bookings when page opens
load();

</script>
</body>
</html>
