<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Room Booking</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
<div class="max-w-4xl mx-auto p-4">

<!-- BOOKING FORM -->
<div class="bg-white rounded-xl shadow-lg p-6 mb-6">
<h1 class="text-3xl font-bold text-center mb-4">Practice Room Booking</h1>

<div class="grid grid-cols-3 gap-4 mb-4">
<button onclick="selectRoom('Practice Bunk 1')" id="btn1" class="roomBtn bg-blue-200 p-3 rounded">Practice Bunk 1</button>
<button onclick="selectRoom('Practice Bunk 2')" id="btn2" class="roomBtn bg-green-200 p-3 rounded">Practice Bunk 2</button>
<button onclick="selectRoom('Piano Only')" id="btn3" class="roomBtn bg-purple-200 p-3 rounded">Piano Only</button>
</div>

<div class="grid grid-cols-3 gap-4 mb-4">
<input type="date" id="date" class="p-2 border rounded">
<select id="startTime" class="p-2 border rounded"></select>
<select id="endTime" class="p-2 border rounded"></select>
</div>

<div class="grid grid-cols-2 gap-4 mb-4">
<input type="text" id="fname" placeholder="First name" class="p-2 border rounded">
<input type="text" id="lname" placeholder="Last name" class="p-2 border rounded">
</div>

<button onclick="bookRoom()" class="w-full bg-blue-600 text-white p-3 rounded">BOOK NOW</button>
</div>

<!-- CURRENT BOOKINGS -->
<div class="bg-white rounded-xl shadow-lg p-6">
<h2 class="text-xl font-bold mb-4">Current Bookings</h2>
<div id="bookingsList"></div>
</div>

</div>

<script>
// 🔴 PASTE YOUR SHEETDB URL HERE
const SHEET_API = "PASTE_YOUR_SHEETDB_URL_HERE";

let selectedRoom = null;
let bookings = [];

// ⏰ Generate time slots
const times = [];
for (let h = 7; h <= 22; h++) {
  for (let m = 0; m < 60; m += 30) {
    times.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  }
}

// Fill time dropdowns
const startSel = document.getElementById("startTime");
const endSel = document.getElementById("endTime");
times.forEach(t=>{
  startSel.innerHTML += `<option value="${t}">${t}</option>`;
  endSel.innerHTML += `<option value="${t}">${t}</option>`;
});

// Prevent end before start
startSel.onchange = () => {
  const startIndex = times.indexOf(startSel.value);
  Array.from(endSel.options).forEach((opt,i)=>{
    opt.disabled = i <= startIndex;
  });
};

// Room selection
function selectRoom(room){
  selectedRoom = room;
  document.querySelectorAll('.roomBtn').forEach(b=>b.classList.remove("ring","ring-4"));
  event.target.classList.add("ring","ring-4");
}

// Convert time to minutes
function mins(t){
  const [h,m] = t.split(":");
  return (+h*60)+(+m);
}

// Check overlap
function overlaps(newB){
  return bookings.some(b=>{
    if(b.Room!==newB.Room || b.Date!==newB.Date) return false;
    return mins(newB.StartTime) < mins(b.EndTime) &&
           mins(newB.EndTime) > mins(b.StartTime);
  });
}

// BOOK ROOM
async function bookRoom(){

  const payload = {
    Room: selectedRoom,
    Date: date.value,
    StartTime: startTime.value,
    EndTime: endTime.value,
    FirstName: fname.value,
    LastName: lname.value
  };

  if(Object.values(payload).includes(null) || Object.values(payload).includes("")){
    alert("Fill all fields"); return;
  }

  if(overlaps(payload)){
    alert("Time already booked"); return;
  }

  // Save to Google Sheet
  await fetch(SHEET_API,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({data:payload})
  });

  // Add locally so it appears instantly
  bookings.push(payload);
  renderBookings();
}

// LOAD BOOKINGS FROM SHEET
async function loadBookings(){
  const res = await fetch(SHEET_API);
  bookings = await res.json();
  renderBookings();
}

// DISPLAY BOOKINGS
function renderBookings(){
  const div = document.getElementById("bookingsList");
  div.innerHTML = "";

  bookings.forEach(b=>{
    div.innerHTML += `
      <div class="border p-2 mb-2 rounded">
        <strong>${b.Room}</strong> — ${b.Date}<br>
        ${b.StartTime} → ${b.EndTime}<br>
        ${b.FirstName} ${b.LastName}
      </div>`;
  });
}

// INIT
document.getElementById("date").value = new Date().toISOString().split("T")[0];
loadBookings();
</script>
</body>
</html>
